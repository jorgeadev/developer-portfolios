# Dependabot configuration
# Keeps GitHub Actions (workflow steps) and npm packages up to date.
# Our custom update-deps.yml workflow handles npm updates for workspaces;
# Dependabot covers the root package.json and GitHub Actions runners.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"

  # ── Root package.json ───────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Ignore workspace sub-packages (handled by our custom update-deps.mjs)
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
