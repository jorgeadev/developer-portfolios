name: ⬆️ Update Dependencies

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday at 08:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI
    inputs:
      allow_major:
        description: "Allow major version bumps"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    name: Check & Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # ── Check if any updates are available (dry-run) ──────────────────────
      - name: Check for outdated packages (dry-run)
        id: check
        run: |
          if node scripts/update-deps.mjs --dry-run; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Apply updates ──────────────────────────────────────────────────────
      - name: Apply dependency updates
        if: steps.check.outputs.has_updates == 'true'
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.allow_major }}" = "true" ]; then
            FLAGS="--major"
          fi
          node scripts/update-deps.mjs $FLAGS

      # ── Install & audit ────────────────────────────────────────────────────
      - name: Install updated packages
        if: steps.check.outputs.has_updates == 'true'
        run: pnpm install --frozen-lockfile=false

      - name: Run security audit
        if: steps.check.outputs.has_updates == 'true'
        run: pnpm audit || true   # don't fail the job on known vulns (CRA)

      - name: Capture audit summary
        if: steps.check.outputs.has_updates == 'true'
        id: audit
        run: |
          AUDIT=$(pnpm audit 2>&1 | tail -5 || echo "Audit completed")
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$AUDIT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ── Create Pull Request ────────────────────────────────────────────────
      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update dependencies"
          branch: chore/update-deps
          delete-branch: true
          title: "⬆️ chore(deps): weekly dependency updates"
          labels: |
            dependencies
            automated
          body: |
            ## 📦 Automated Dependency Update

            This PR was created automatically by the **Update Dependencies** workflow.

            ### What changed
            All workspace package.json files have been updated to the latest
            compatible versions (major bumps are excluded by default).

            ### Security audit
            ```
            ${{ steps.audit.outputs.summary }}
            ```

            ### Notes
            - `cross-env` is pinned at `7.0.3` for CRA (`react-scripts`) compatibility in `developer-portfolio-2`
            - Major version bumps are **not** included. To apply them, trigger this workflow manually with **"Allow major version bumps"** enabled.
            - Run `pnpm install` locally and test before merging.

            ---
            *Triggered by: `${{ github.event_name }}` on `${{ github.ref_name }}`*
